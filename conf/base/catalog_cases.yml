# =========================================================================== #
# DataCatalog — salidas de los pipelines por caso (capas >= 03)
# =========================================================================== #
# Las tablas maestras (primary), salidas de modelo (model_output) y artefactos
# de reporte (reporting) se persisten tipados. Los datasets intermedios no
# declarados (p. ej. b_baskets) usan MemoryDataset dentro del run.
# --------------------------------------------------------------------------- #

# --- Caso A ---------------------------------------------------------------- #
master_caso_a_diario:
  type: pandas.ParquetDataset
  filepath: data/03_primary/master_caso_a_diario.parquet
  metadata: {kedro-viz: {layer: primary}}

master_caso_a_semanal:
  type: pandas.ParquetDataset
  filepath: data/03_primary/master_caso_a_semanal.parquet
  metadata: {kedro-viz: {layer: primary}}

a_join_report:
  type: json.JSONDataset
  filepath: data/08_reporting/a_join_report.json

a_forecast_metrics:
  type: json.JSONDataset
  filepath: data/07_model_output/a_forecast_metrics.json

a_orders:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/a_orders.parquet
  metadata: {kedro-viz: {layer: model_output}}

a_forecast_test:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/a_forecast_test.parquet
  metadata: {kedro-viz: {layer: model_output}}

a_narrative:
  type: json.JSONDataset
  filepath: data/08_reporting/a_narrative.json

