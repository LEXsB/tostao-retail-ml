[project]
name = "tostao-retail-ml"
version = "0.1.0"
description = "Plataforma DS/ML retail para Tostao: forecasting + abastecimiento, combos y AOV."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Alexander Bernal", email = "bernalm.alexander@gmail.com" }]
keywords = ["kedro", "mlops", "retail", "forecasting", "mlflow"]

# Núcleo del framework reutilizable (se instala primero; los casos añaden extras).
dependencies = [
    "kedro>=0.19,<1.0",
    # El catálogo persiste con pandas/PyArrow; Polars se usa directo dentro de nodos.
    # Se usa kedro-datasets sin extras (el extra `pandas` arrastra `deltalake`, sin
    # wheel para Windows). Las clases de dataset cargan pandas/pyarrow/plotly de
    # forma perezosa, provistos aquí como dependencias directas.
    "kedro-datasets>=4.0",
    "kedro-viz>=10.0",
    "kedro-mlflow>=0.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "polars>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "optuna>=4.0",
    "optuna-integration>=4.0",
    "shap>=0.46",
    "pandera>=0.20",
    "plotly>=5.22",
    "kaleido>=0.2",
    "jinja2>=3.1",
    "mlflow>=2.14",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Caso A — forecasting probabilístico + optimización de abastecimiento.
caso_a = ["statsforecast>=1.7"]
# Caso B — reglas de asociación y grafos de co-compra.
caso_b = ["mlxtend>=0.23", "efficient-apriori>=2.0", "networkx>=3.3"]
# Serving de inferencia.
serving = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
# MLOps: versionado de datos + monitoreo de drift.
mlops = ["dvc>=3.51", "evidently>=0.4.30"]
# Observabilidad.
observability = ["prometheus-client>=0.20"]
# Todo el stack de dominio junto.
all = [
    "tostao-retail-ml[caso_a,caso_b,serving,mlops,observability]",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "nbstripout>=0.7",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "types-PyYAML",
]

[project.scripts]
tostao-ml = "tostao_ml.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tostao_ml"]

# --------------------------------------------------------------------------- #
# Kedro
# --------------------------------------------------------------------------- #
[tool.kedro]
package_name = "tostao_ml"
project_name = "tostao-retail-ml"
kedro_init_version = "0.19.15"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "tostao-retail-ml-local"

# --------------------------------------------------------------------------- #
# Herramientas de calidad
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PD", "NPY", "RUF"]
# RUF001/2/3: el código está en español (acentos, «», →) y usa notación
# matemática (ρ, ∞, η); los avisos de "confusables" serían ruido constante.
ignore = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "S101"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []
exclude = ["notebooks/", "data/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raíz al path para importar el paquete top-level `serving` (fuera de src/).
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=tostao_ml --cov-report=term-missing"
markers = [
    "unit: pruebas unitarias rápidas y aisladas",
    "integration: pipelines Kedro end-to-end sobre datos sintéticos",
    "data_contract: validación de esquemas de datos",
    "calificacion: simula un periodo futuro y califica el modelo (regresión periódica)",
]

[tool.coverage.run]
branch = true
source = ["src/tostao_ml"]
omit = ["*/pipeline_registry.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
